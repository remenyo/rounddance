[package]
name = "rounddance-security"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Zigbee security: keys, CCM*, aux headers, replay tables, CBKE (no_std)"

[features]
default = []
host = ["dep:p256", "dep:sha2", "dep:hmac"]

[dependencies]
p256 = { version = "0.14", optional = true }
sha2 = { version = "0.11", optional = true }
hmac = { version = "0.13", optional = true }

[dev-dependencies]
rounddance-aps = { version = ">=0.1.0-alpha.2, <0.2.0", path = "../rounddance-aps" }
rounddance-mac-sap = { version = ">=0.1.0-alpha.2, <0.2.0", path = "../rounddance-mac-sap" }
rounddance-nwk = { version = ">=0.1.0-alpha.2, <0.2.0", path = "../rounddance-nwk" }
