rounddance-hal-wasm = { version = ">=0.1.0-alpha.3, <0.2.0", path = "../rounddance-hal-wasm" }
rounddance-browser = { version = ">=0.1.0-alpha.3, <0.2.0", path = "../rounddance-browser" }
