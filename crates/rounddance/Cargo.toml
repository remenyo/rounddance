[package]
name = "rounddance"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rounddance Zigbee-compatible stack: one library over the portable no_std layers, sim, and host HAL"

[lib]
name = "rounddance"
path = "src/lib.rs"

[dependencies]
rounddance-mac-sap = { version = ">=0.1.0-alpha.3, <0.2.0", path = "../rounddance-mac-sap" }
rounddance-nwk = { version = ">=0.1.0-alpha.3, <0.2.0", path = "../rounddance-nwk" }
rounddance-aps = { version = ">=0.1.0-alpha.3, <0.2.0", path = "../rounddance-aps" }
rounddance-zdo = { version = ">=0.1.0-alpha.3, <0.2.0", path = "../rounddance-zdo" }
rounddance-security = { version = ">=0.1.0-alpha.3, <0.2.0", path = "../rounddance-security" }
rounddance-zcl = { version = ">=0.1.0-alpha.3, <0.2.0", path = "../rounddance-zcl" }
rounddance-gp = { version = ">=0.1.0-alpha.3, <0.2.0", path = "../rounddance-gp" }
rounddance-ifc = { version = ">=0.1.0-alpha.3, <0.2.0", path = "../rounddance-ifc" }
rounddance-commission = { version = ">=0.1.0-alpha.3, <0.2.0", path = "../rounddance-commission" }
rounddance-compat = { version = ">=0.1.0-alpha.3, <0.2.0", path = "../rounddance-compat" }
rounddance-direct = { version = ">=0.1.0-alpha.3, <0.2.0", path = "../rounddance-direct" }
rounddance-roles = { version = ">=0.1.0-alpha.3, <0.2.0", path = "../rounddance-roles" }
