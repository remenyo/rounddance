[package]
name = "rounddance-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "C ABI over the first complete host transaction (adapter shim, not a protocol crate)"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
rounddance-commission = { version = ">=0.1.0-alpha.2, <0.2.0", path = "../rounddance-commission" }
rounddance-hal-esp = { version = ">=0.1.0-alpha.2, <0.2.0", path = "../rounddance-hal-esp" }
rounddance-hal-host = { version = ">=0.1.0-alpha.2, <0.2.0", path = "../rounddance-hal-host" }
rounddance-security = { version = ">=0.1.0-alpha.2, <0.2.0", path = "../rounddance-security" }
rounddance-zcl = { version = ">=0.1.0-alpha.2, <0.2.0", path = "../rounddance-zcl" }

[dev-dependencies]
rounddance-commission = { version = ">=0.1.0-alpha.2, <0.2.0", path = "../rounddance-commission" }
