[package]
name = "rounddance-inspect"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Packet inspector: 802.15.4/NWK/APS/ZCL dissector chain, decode trees, pcap ingest, session engine, listener/sender traits"

[features]
default = ["std"]
std = []
# Host live-listener binary: termios serial driver over `libc` plus
# the `std` sniffer parser/replay module. Never enabled for wasm.
live = ["std", "dep:libc"]

[dependencies]
rounddance-mac-sap = { version = ">=0.1.0-alpha.2, <0.2.0", path = "../rounddance-mac-sap" }
rounddance-nwk = { version = ">=0.1.0-alpha.2, <0.2.0", path = "../rounddance-nwk" }
rounddance-aps = { version = ">=0.1.0-alpha.2, <0.2.0", path = "../rounddance-aps" }
rounddance-zcl = { version = ">=0.1.0-alpha.2, <0.2.0", path = "../rounddance-zcl" }
rounddance-security = { version = ">=0.1.0-alpha.2, <0.2.0", path = "../rounddance-security" }
rounddance-gp = { version = ">=0.1.0-alpha.2, <0.2.0", path = "../rounddance-gp" }
rounddance-direct = { version = ">=0.1.0-alpha.2, <0.2.0", path = "../rounddance-direct" }
libc = { version = "0.2", optional = true }

[[bin]]
name = "inspect-live"
path = "src/bin/inspect-live.rs"
required-features = ["live"]
