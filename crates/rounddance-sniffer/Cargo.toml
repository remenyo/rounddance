[package]
name = "rounddance-sniffer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Offline 802.15.4 sniffer: file input, dissect, text/JSON report, pcap-out, timelines"

[features]
default = ["std"]
std = ["rounddance-inspect/std"]

[dependencies]
rounddance-inspect = { version = ">=0.1.0-alpha.4, <0.2.0", path = "../rounddance-inspect" }
# Raw termios serial driver for the `rd-sniff --live` binary (unix).
# The library itself stays `forbid(unsafe_code)`-clean: it is generic
# over any `Read + Write` port, and only the binary touches `libc`.
libc = "0.2"

[dev-dependencies]
rounddance-aps = { version = ">=0.1.0-alpha.4, <0.2.0", path = "../rounddance-aps" }
rounddance-nwk = { version = ">=0.1.0-alpha.4, <0.2.0", path = "../rounddance-nwk" }
rounddance-zcl = { version = ">=0.1.0-alpha.4, <0.2.0", path = "../rounddance-zcl" }
rounddance-security = { version = ">=0.1.0-alpha.4, <0.2.0", path = "../rounddance-security" }

[[bin]]
name = "rd-sniff"
path = "src/bin/rd-sniff.rs"
required-features = ["std"]
