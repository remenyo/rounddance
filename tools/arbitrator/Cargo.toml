[package]
name = "lab-arbitrator"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Lab hardware arbitrator: exclusive serial-port leases, flash/reset/run helpers, capture hooks, clean-lifecycle runner"

[[bin]]
name = "arbitrator"
path = "src/main.rs"

[lib]
name = "lab_arbitrator"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
