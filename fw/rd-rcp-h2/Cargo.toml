[package]
name = "rd-rcp-h2"
version = "0.1.0"
edition = "2021"
resolver = "2"

[[bin]]
name = "rd-rcp-h2"
harness = false # do not use the built-in cargo test harness

[dependencies]
esp-idf-sys = { version = "0.38", features = ["native"] }
rd-rcp = { path = "../rd-rcp" }

[build-dependencies]
embuild = "0.33.5"

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[workspace]
