[build]
# S31 is RV32IMAFC + single-precision FPU: the IDF build for this
# target uses -march=rv32imafc_* -mabi=ilp32f, so the Rust target must
# be the FPU triple (soft-float riscv32imac objects do not link
# against single-float IDF archives).
target = "riscv32imafc-esp-espidf"

[target.'cfg(target_os = "espidf")']
linker = "ldproxy"
rustflags = [ "--cfg", "espidf_time64" ]

[unstable]
build-std = ["std", "panic_abort"]

[env]
MCU = "esp32s31"
IDF_PATH = "/home/dev/projects/esp-idf-v6"
CARGO_WORKSPACE_DIR = { value = "", relative = true }
